<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Queen Store 👑</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>body{font-family:'Cairo',sans-serif}</style>
</head>
<body class="bg-pink-50">
<header class="bg-white p-4 flex justify-between shadow sticky top-0">
<h1 class="font-bold text-pink-600 text-xl">👑 Queen Store</h1>
<div id="cart-count" class="bg-pink-600 text-white px-3 py-1 rounded-full">0 🛒</div>
</header>
<section class="bg-gradient-to-r from-pink-500 to-purple-600 text-white text-center py-14">
<h2 class="text-3xl font-bold">أهلاً بيكي في متجر الملكة</h2>
<p class="mt-2">أشيك لبس وشنط وميكب في مصر</p>
</section>
<main id="products" class="grid grid-cols-2 gap-3 p-4 max-w-5xl mx-auto"></main>
<script>
const products=[
{n:"فستان بينك",p:750,img:"https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=400"},
{n:"شنطة كروس",p:350,img:"https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=400"},
{n:"طقم ميكب",p:450,img:"https://images.unsplash.com/photo-1596462502278-27bfdc403348?w=400"},
{n:"هيلز أبيض",p:600,img:"https://images.unsplash.com/photo-1543163521-1bf539c55dd2?w=400"},
{n:"طرحة ستان",p:150,img:"https://images.unsplash.com/photo-1609351431202-1e0f0137899a?w=400"},
{n:"اكسسوارات",p:200,img:"https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?w=400"},
];
let cart=0;
const grid=document.getElementById('products');
products.forEach((x,i)=>{
grid.innerHTML+=`<div class="bg-white rounded-2xl overflow-hidden shadow"><img src="${x.img}" class="h-40 w-full object-cover"><div class="p-3 text-center"><h3 class="font-bold text-sm">${x.n}</h3><p class="text-pink-600 font-bold">${x.p} جنيه</p><button onclick="addCart()" class="bg-black text-white w-full py-2 rounded-xl mt-2 text-sm">أضف للسلة</button></div></div>`
});
function addCart(){cart++;document.getElementById('cart-count').innerText=cart+' 🛒';}
</script>
</body>
</html>
